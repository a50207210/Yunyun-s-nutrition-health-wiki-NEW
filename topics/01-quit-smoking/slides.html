、身體活動、調整作息與專業協助，是戒菸過程的重要支持。", "source": "PDF第31–33頁"}, {"title": "今天的行動", "text": "選一個可行的戒菸準備行動，並確認可以取得哪些專業支持。", "source": "PDF第23–35頁"}];let page=0;const $=id=>document.getElementById(id);function show(){const s=slides[page];$('stitle').textContent=s.title;$('sbody').textContent=s.text;$('ssource').textContent='資料來源：戒菸教戰手冊 (2024年11月)，'+s.source;$('count').textContent=(page+1)+' / '+slides.length;$('bar').style.width=((page+1)/slides.length*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;}$('prev').onclick=()=>{page=Math.max(0,page-1);show()};$('next').onclick=()=>{page=Math.min(slides.length-1,page+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});show();</script><footer class="footer">資料依據使用者指定之政府出版手冊整理｜保留原始出版年份與PDF頁序｜僅供衛教學習，不代替專業診療。<br>圖片引用與公開利用應確認原出版社之授權條件。</footer></body></html>
