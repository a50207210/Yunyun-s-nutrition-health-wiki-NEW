urce": "PDF第17–23頁"}, {"title": "學習重點", "text": "健康生活可以協助風險管理，但不能保證預防失智，也不能取代專業診斷。", "source": "PDF第5–9頁"}];let page=0;const $=id=>document.getElementById(id);function show(){const s=slides[page];$('stitle').textContent=s.title;$('sbody').textContent=s.text;$('ssource').textContent='資料來源：失智症衛教及資源手冊 (約2017年版本)，'+s.source;$('count').textContent=(page+1)+' / '+slides.length;$('bar').style.width=((page+1)/slides.length*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;}$('prev').onclick=()=>{page=Math.max(0,page-1);show()};$('next').onclick=()=>{page=Math.min(slides.length-1,page+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});show();</script><footer class="footer">資料依據使用者指定之政府出版手冊整理｜保留原始出版年份與PDF頁序｜僅供衛教學習，不代替專業診療。<br>圖片引用與公開利用應確認原出版社之授權條件。</footer></body></html>
