<style>
:root{--ink:#20394b;--green:#187b67;--mint:#d8f4e9;--warm:#fff6df;--muted:#5c6c78}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(130deg,#e6f6ee,#f7fcff 55%,#fff3df);min-height:100vh}.shell{max-width:1160px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.025em}.tag{color:var(--green);font-size:.88rem}main{margin:22px auto 18px;min-height:520px;background:white;border:1px solid #d9e9e8;border-radius:30px;box-shadow:0 20px 64px #2c625020;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden}.copy{padding:clamp(28px,5vw,70px);display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(2.2rem,4.5vw,4.35rem);line-height:1.2;margin:0 0 27px;letter-spacing:-.03em}p{font-size:clamp(1.1rem,2vw,1.52rem);line-height:1.8;margin:0;color:#39556a}.source{font-size:.81rem;margin-top:35px;color:#6a7b84;line-height:1.6}.art{min-height:450px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 60% 33%,#ffffff88,#d6f5e8 60%,#b7e7d6);position:relative}.plate{width:min(72%,380px);aspect-ratio:1;border:14px solid #fff;border-radius:50%;box-shadow:0 20px 40px #235d3d2b,inset 0 0 0 3px #bfd1d0;background:conic-gradient(#f8bb69 0 30%,#d9e2a1 30% 53%,#79bf86 53% 76%,#e8c89b 76% 100%);position:relative;transform:rotate(-9deg)}.plate:after{content:"均衡\A飲食";white-space:pre;text-align:center;display:grid;place-items:center;position:absolute;inset:27%;border-radius:50%;background:white;color:var(--green);font-size:clamp(1.2rem,2.5vw,2rem);font-weight:800;line-height:1.2;box-shadow:0 4px 25px #0001}.dot{position:absolute;border-radius:50%;opacity:.7}.one{height:28px;width:28px;background:#f6c464;top:12%;left:10%}.two{height:17px;width:17px;background:#6ec6b8;bottom:13%;right:13%}.three{height:13px;width:13px;background:#e99b8d;top:19%;right:16%}.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.buttons{display:flex;gap:10px}button{font:inherit;border:1px solid #bad6d0;padding:11px 18px;border-radius:12px;background:#fff;color:#21534c;cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.4;cursor:not-allowed}.counter{font-variant-numeric:tabular-nums;color:#64727b}.bar{height:7px;background:#dfe9e5;border-radius:10px;margin-top:13px;overflow:hidden}.fill{height:100%;background:var(--green);width:10%;transition:width .2s}footer{margin-top:15px;font-size:.83rem;color:#576d77}a{color:#136c75}kbd{border:1px solid #bdcfcc;padding:1px 5px;border-radius:4px}@media(max-width:760px){.shell{padding:14px}main{grid-template-columns:1fr;min-height:unset}.copy{padding:28px}.art{min-height:190px;grid-row:1}.plate{width:155px;border-width:8px}.plate:after{font-size:1rem}h1{font-size:2rem}.source{margin-top:22px}p{font-size:1.12rem}}

</style></head><body><div class="shell"><header class="top"><div class="brand">Yunyun's nutrition-health-wiki</div><div class="tag">教學型HTML簡報 · 政府指定資料版</div></header><main aria-live="polite"><section class="copy"><h1 id="title"></h1><p id="body"></p><div class="source" id="source"></div></section><aside class="art" aria-hidden="true"><span class="dot one"></span><span class="dot two"></span><span class="dot three"></span><div class="plate"></div></aside></main><nav class="controls" aria-label="簡報導覽"><div class="buttons"><button id="prev" type="button">← 上一頁</button><button class="primary" id="next" type="button">下一頁 →</button></div><div class="counter"><span id="counter"></span> · <a href="../wiki/index.md">Wiki目錄</a></div></nav><div class="bar"><div class="fill" id="fill"></div></div><footer>方向鍵← →可切換投影片。資料依指定政府手冊原始版本整理，不取代個人營養與醫療建議。原始PDF不公開。</footer></div><script>
const slides=[{"title": "均衡飲食與健康管理", "body": "從每天的六大類食物開始，理解飲食、活動與健康的關係。", "source": "來源：2018年版《每日飲食指南手冊》PDF第4–6頁"}, {"title": "今天會學到什麼？", "body": "辨認六大類食物；理解熱量與份量；安排均衡餐食；分辨一般飲食建議與疾病個別化管理。", "source": "來源：Wiki〈六大類食物與營養素〉、〈熱量需求與營養均衡〉"}, {"title": "均衡飲食的核心", "body": "選擇不同類別的食物，注意份量與多樣性，並讓攝取能量與活動需求相配合。", "source": "來源：2018年版《每日飲食指南手冊》PDF第4頁"}, {"title": "六大類食物", "body": "全穀雜糧｜豆魚蛋肉｜乳品｜蔬菜｜水果｜油脂與堅果種子。不同類別各有營養功能，不可只靠單一「超級食物」。", "source": "來源：2018年版《每日飲食指南手冊》PDF第4–6頁"}, {"title": "全穀雜糧也要多樣", "body": "米飯、糙米、燕麥、地瓜都可作為主食選擇。2018年版指南鼓勵以未精製全穀雜糧替換部分精製主食。", "source": "來源：2018年版《每日飲食指南手冊》PDF第14–15頁"}, {"title": "認識食物份量", "body": "不同類別「一份」計算基準不同：例如蔬菜約100公克生重；乳品一杯約240毫升。閱讀指南要看清楚份量單位。", "source": "來源：2018年版《每日飲食指南手冊》PDF第6、12–13頁"}, {"title": "每天需要多少熱量？", "body": "熱量需求與年齡、性別、體重和活動量有關。政府手冊的熱量層級是參考示例，而不是所有人共用的處方。", "source": "來源：2018年版《每日飲食指南手冊》PDF第8–11頁"}, {"title": "慢性病飲食需要個別化", "body": "糖尿病飲食以均衡為基礎，也需要管理含醣食物份量、餐次，搭配血糖監測、活動與醫療建議。", "source": "來源：2021年版《糖尿病與我》PDF第18–20頁"}, {"title": "孕期與高齡營養不同", "body": "孕期重視葉酸、鐵、碘等營養與適當熱量；高齡者還須留意蛋白質、食物質地及進食困難。需要依個人情況評估。", "source": "來源：2020年《食在好孕》PDF第4、7–8頁；2021年《糖尿病與我》PDF第21–24頁"}, {"title": "生活練習與重點回顧", "body": "想一想：今天吃到了哪些食物類別？是否可以用一種未精製主食替換白飯？運動與戒菸如何一起支持健康生活？", "source": "來源：Wiki〈均衡飲食與健康生活〉、〈運動、飲食與健康管理〉"}];
let idx=0;const $=id=>document.getElementById(id);
function render(){const s=slides[idx];$('title').textContent=s.title;$('body').textContent=s.body;$('source').textContent=s.source;$('counter').textContent=`${idx+1} / ${slides.length}`;$('fill').style.width=((idx+1)/slides.length*100)+'%';$('prev').disabled=idx===0;$('next').disabled=idx===slides.length-1;document.title=s.title+'｜均衡飲食與健康管理';}
$('prev').addEventListener('click',()=>{if(idx>0){idx--;render();}});$('next').addEventListener('click',()=>{if(idx<slides.length-1){idx++;render();}});window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx<slides.length-1){idx++;render();}if(e.key==='ArrowLeft'&&idx>0){idx--;render();}});render();
</script></body></html>
